name: credentials-tracker

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: credentials
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Europe/Moscow
    ports:
      - "53308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  # Тестовый почтовый сервер: принимает письма и показывает их в веб-интерфейсе
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  mysql-data:
